version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: codescope-db
    restart: always
    environment:
      POSTGRES_USER: codescope_user
      POSTGRES_PASSWORD: codescope_secure_password
      POSTGRES_DB: codescope_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  # Redis Job Queue Service (for Background BullMQ processing)
  redis:
    image: redis:7-alpine
    container_name: codescope-queue
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # NestJS Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codescope-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://codescope_user:codescope_secure_password@postgres:5432/codescope_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - postgres
      - redis

  # Next.js Frontend App Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codescope-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
