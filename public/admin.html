<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="admin_title">WebPulse Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: var(--bg-primary); color: var(--text-primary); }
        .admin-container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; text-align: center; }
        .stat-card h3 { margin: 0; color: var(--text-muted); font-size: 14px; text-transform: uppercase; }
        .stat-card p { margin: 10px 0 0 0; font-size: 32px; font-weight: 800; font-family: var(--font-heading); color: var(--color-emerald); }
        .users-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .users-table th, .users-table td { padding: 12px; border-bottom: 1px solid var(--border-color); text-align: left; }
        .users-table th { background-color: var(--bg-tertiary); font-weight: 600; }
        .badge-admin { background-color: var(--color-emerald); color: white; padding: 2px 8px; border-radius: 12px; font-size: 11px; }
        .badge-user { background-color: var(--bg-tertiary); color: var(--text-primary); padding: 2px 8px; border-radius: 12px; font-size: 11px; }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <div>
                <h1 style="margin: 0; font-family: var(--font-heading);" data-i18n="admin_title">WebPulse Admin Dashboard</h1>
                <p style="margin: 5px 0 0 0; color: var(--text-secondary);">Sistem metrikleri ve kullanıcı yönetimi</p>
            </div>
            <div>
                <a href="index.html" class="btn btn-secondary" style="text-decoration: none;">&larr; Ana Sayfaya Dön</a>
                <button id="btn-lang" class="btn btn-secondary" style="margin-left: 10px;">🇬🇧 EN</button>
            </div>
        </div>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px;">
            <div class="stat-card">
                <h3>Kayıtlı Kullanıcılar</h3>
                <p id="stat-users">0</p>
            </div>
            <div class="stat-card">
                <h3>Gerçekleşen Taramalar</h3>
                <p id="stat-scans">0</p>
            </div>
            <div class="stat-card">
                <h3>Strix Pentest Kullanımı</h3>
                <p id="stat-strix">0</p>
            </div>
        </div>
        
        <h2 style="font-family: var(--font-heading); border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">Kullanıcı Listesi</h2>
        <div style="overflow-x: auto; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px;">
            <table class="users-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>E-Posta</th>
                        <th>Kayıt Türü</th>
                        <th>Rol</th>
                        <th>Kayıt Tarihi</th>
                    </tr>
                </thead>
                <tbody id="users-tbody">
                    <!-- JS ile doldurulacak -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="i18n.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // İstatistikleri çek
                const statsRes = await fetch('/api/admin/stats');
                if (statsRes.status === 403 || statsRes.status === 401) {
                    alert('Bu sayfaya erişim yetkiniz yok.');
                    window.location.href = 'index.html';
                    return;
                }
                const stats = await statsRes.json();
                document.getElementById('stat-users').innerText = stats.totalUsers || 0;
                document.getElementById('stat-scans').innerText = stats.totalScans || 0;
                document.getElementById('stat-strix').innerText = stats.strixUses || 0;
                
                // Kullanıcı listesini çek
                const usersRes = await fetch('/api/admin/users');
                const users = await usersRes.json();
                
                const tbody = document.getElementById('users-tbody');
                users.forEach(user => {
                    const tr = document.createElement('tr');
                    const loginType = user.googleId ? 'Google' : 'Email/Şifre';
                    const roleBadge = user.role === 'admin' ? '<span class="badge-admin">Admin</span>' : '<span class="badge-user">User</span>';
                    tr.innerHTML = `
                        <td>${user.id}</td>
                        <td>${user.email}</td>
                        <td>${loginType}</td>
                        <td>${roleBadge}</td>
                        <td>${new Date(user.createdAt).toLocaleString()}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
                alert('Veriler yüklenirken hata oluştu. Oturum açmamış olabilirsiniz.');
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
